version: "3.9"

services:
  # ─── Backend: Flask API ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placementpro-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    volumes:
      # Persist the SQLite database across container restarts
      - db_data:/home/user/app/app
    networks:
      - placementpro-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Frontend: React/Vite → nginx ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Tells Vite where the backend API lives at BUILD TIME
        VITE_API_URL: http://localhost:5000/api
    container_name: placementpro-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - placementpro-net

# ─── Volumes & Networks ───────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local

networks:
  placementpro-net:
    driver: bridge
